<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>切片引擎 3D 演示</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(12, 18, 32, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --text: #e8eef8;
      --muted: #8b9bb4;
      --accent: #ff8a3d;
      --wall: #ff6a2b;
      --inner: #3ddc97;
      --infill: #f5c542;
      --support: #8b7cff;
      --slice: #4fc3f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; overflow: hidden; }
    #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute; left: 20px; top: 20px; width: min(420px, calc(100vw - 40px));
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 18px 14px; backdrop-filter: blur(16px); z-index: 2;
    }
    .hud h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: 0.02em; }
    .hud .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    .stage-name { font-size: 15px; font-weight: 650; color: var(--accent); margin-bottom: 6px; }
    .caption { font-size: 13px; line-height: 1.55; color: var(--text); min-height: 62px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin: 12px 0 4px; font-size: 11px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .controls { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    button {
      background: #182033; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
      padding: 7px 12px; cursor: pointer; font-size: 12px;
    }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: #1a1008; border-color: var(--accent); }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
    .time { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--muted); width: 64px; text-align: right; }
    .modes { display: flex; gap: 6px; margin-top: 10px; }
    .hint { position: absolute; right: 20px; bottom: 20px; color: var(--muted); font-size: 12px; z-index: 2; }
    .record .hud, .record .hint { display: none; }
    .record .caption-bar {
      display: block; position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 22px; z-index: 3; text-align: center; min-width: 520px;
    }
    .caption-bar { display: none; }
    .caption-bar b { display: block; color: var(--accent); margin-bottom: 4px; font-size: 16px; }
    .caption-bar span { color: var(--text); font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>切片引擎 3D 演示</h1>
    <div class="sub">对照 OrcaSlicer：切层 → 墙 → 填充 → 支撑 → 路径</div>
    <div class="stage-name" id="stageName">准备模型</div>
    <div class="caption" id="caption">右侧悬空的台阶模型。切片时 Z 向上，和切片器预览一致。</div>
    <div class="legend">
      <span><i style="background:#c5d0de"></i>模型</span>
      <span><i style="background:var(--slice)"></i>切平面</span>
      <span><i style="background:var(--wall)"></i>外墙</span>
      <span><i style="background:var(--inner)"></i>内墙</span>
      <span><i style="background:var(--infill)"></i>填充</span>
      <span><i style="background:var(--support)"></i>支撑</span>
    </div>
    <div class="controls">
      <button id="btnPlay">暂停</button>
      <button id="btnReplay">重播</button>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <div class="time" id="time">0.0s</div>
    </div>
    <div class="modes">
      <button id="btnClassic" class="active">Classic 洋葱墙</button>
      <button id="btnArachne">Arachne 变线宽</button>
    </div>
  </div>
  <div class="caption-bar" id="captionBar"><b id="barTitle"></b><span id="barText"></span></div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 空格播放/暂停</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./demo.js"></script>
</body>
</html>
